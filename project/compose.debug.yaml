services:
  pgadmin:
    image: dpage/pgadmin4:9.19
    profiles: [debug]
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD_FILE: /run/secrets/db_password
    secrets: [db_password]
    ports:
      - "127.0.0.1:5050:80"
    depends_on:
      db:
        condition: service_healthy
