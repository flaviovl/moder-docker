[project]
name = "api"
version = "0.1.0"
requires-python = ">=3.15"
dependencies = [
    "fastapi>=0.165",
    "uvicorn[standard]>=0.54",
    "pandas>=3.1",
    "psycopg[c]>=3.3",
    "psycopg-pool>=3.2",
]

[dependency-groups]
dev = [
    "pytest>=9.2",
    "httpx2>=2.16",
]

# Índice privado de exemplo: explicit faz o uv consultá-lo só para pacotes que o citam (nenhum).
# Existe para a demonstração do segredo no build; o token usado é falso.
[[tool.uv.index]]
name = "privado"
url = "https://pypi.privado.invalid/simple"
explicit = true
