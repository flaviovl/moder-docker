server {
    listen 8080;
    root /usr/share/nginx/html;

    # Resolver do Docker e endereço em variável: o Nginx sobe mesmo antes de a API existir.
    location /api/ {
        resolver 127.0.0.11 valid=10s;
        set $api http://api:8000;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $api;
    }

    location / {
        try_files $uri $uri.html $uri/ =404;
    }
}
